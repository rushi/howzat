[project]
name = "howzat"
version = "0.1.0"
description = "Automatically mute cricket advertisements using audio fingerprinting"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Rushi Vishavadia" }]
keywords = [
    "audio",
    "fingerprinting",
    "cricket",
    "ipl",
    "mute",
    "ads",
    "howzat",
]

dependencies = [
    "typer[all]>=0.9.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "pyyaml>=6.0",
    "pyaudio>=0.2.13",
    "numpy>=1.24",
    "scipy>=1.10",
    "pydub>=0.25",
    "requests>=2.28",
    "pync>=2.0",
    "rich>=13.0",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "sse-starlette>=1.8",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "httpx>=0.27",
    "mypy>=1.0",
    "ruff>=0.8",
    "pre-commit>=3.0",
]

[project.scripts]
howzat = "src.cli.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.hatch.build.targets.sdist]
include = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # Pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "ARG", # flake8-unused-arguments
    "SIM", # flake8-simplify
    "TCH", # flake8-type-checking
    "PTH", # flake8-use-pathlib
    "ERA", # eradicate (commented out code)
    "PL",  # Pylint
    "RUF", # Ruff-specific rules
]
ignore = [
    "PLR0913", # Too many arguments
    "PLR2004", # Magic value comparison
    "ARG001",  # Unused function argument (common in callbacks)
    "ARG002",  # Unused method argument
    "PLW0603", # Global statement (used for singletons)
    "PLC0415", # Import not at top-level (lazy imports for optional deps)
    "B008",    # Function call in default argument (typer pattern)
    "B904",    # raise without from in except (typer.Exit pattern)
    "PLR0911", # Too many return statements
    "PLR0915", # Too many statements
    "TC001",   # Move import into type-checking block
    "TC002",   # Move third-party import into type-checking block
    "TC003",   # Move stdlib import into type-checking block
    "UP037",   # Remove quotes from type annotation (needed for forward refs)
    "SIM102",  # Nested if statements (can improve readability)
]

[tool.ruff.lint.per-file-ignores]
"src/cli/*" = [
    "PLR0917", # Typer commands take options as parameters
]
"tests/*" = [
    "ARG",     # Unused arguments OK in tests (fixtures)
    "PLR2004", # Magic values OK in tests
    "S101",    # Assert OK in tests
]

[tool.ruff.lint.isort]
known-first-party = ["cli", "core", "actions", "config", "db", "utils"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.mypy]
python_version = "3.10"
strict = true

[[tool.mypy.overrides]]
module = "src.web.*"
# FastAPI decorators are not fully typed; suppress untyped-decorator noise
disallow_untyped_decorators = false
